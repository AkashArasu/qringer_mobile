plugins {
    id "com.android.library"
}

def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0].toInteger()
def builtInKotlin = project.findProperty("android.builtInKotlin")?.toBoolean()
if (agpMajor < 9 || builtInKotlin == false) {
    apply plugin: "kotlin-android"
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

android {
    if (project.android.hasProperty("namespace")) {
        namespace = "io.getstream.video.flutter.stream_video_push_notification"
    }

    compileSdk = flutter.compileSdkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 21
        consumerProguardFiles 'consumer-rules.pro'
    }

    dependencies {
        def firebaseCoreProject = findProject(':firebase_core')
        if (firebaseCoreProject != null) {
            implementation platform("com.google.firebase:firebase-bom:${firebaseCoreProject.properties['FirebaseSDKVersion']}")
        }
        implementation 'com.google.firebase:firebase-auth'
        implementation 'androidx.work:work-runtime-ktx:2.9.0'
        implementation 'androidx.core:core-ktx:1.17.0'
        implementation 'androidx.appcompat:appcompat:1.7.0'
        implementation 'de.hdodenhof:circleimageview:3.1.0'
        implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
        implementation 'com.fasterxml.jackson.core:jackson-core:2.20.0'
        implementation 'com.fasterxml.jackson.core:jackson-databind:2.20.0'
        implementation "io.coil-kt:coil:1.4.0"
        implementation 'androidx.core:core-telecom:1.0.1'
        implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
